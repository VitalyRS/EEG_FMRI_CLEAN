# =============================================================================
# cleanP02.yaml — параметры чистки для cleanP02.py (BCG -> ICA-оптимизация -> ICA)
# =============================================================================
# Вход:  data/<sid>/segments/<seg>/<seg>_bergen_250hz.set   (результат cleanP01.py)
# Выход: data/<sid>/derivatives/03_bcg/<seg>/<seg>_bcg_clean.fif
#        data/<sid>/segments/<seg>/optuna_ica_best_params.json
#        data/<sid>/derivatives/05_ica/<seg>/<seg>_ica_clean.fif (+ .set, отчёты)
#
# Значения по умолчанию = текущее поведение step08/step10/step11.
# Любой параметр можно переопределить из командной строки:
#   python cleanP02.py --subjects 1916 --set bcg.fixed_npc=4 --set ica_opt.duration_sec=300
# Если ключ из этого файла удалить — используется значение по умолчанию из step-модуля.
# ВНИМАНИЕ: в YAML слово off без кавычек = false. Пишите "off" в кавычках
# (скрипт всё равно понимает false как "off" для burst_crit).

# -----------------------------------------------------------------------------
# Что и как запускать
# -----------------------------------------------------------------------------
run:
  segments: [ec, eo, drone, lasertag, video]   # какие сегменты обрабатывать
  steps:
    bcg: true          # step08: band-pass + fMRIB OBS (BCG)
    ica_opt: true      # step10: подбор clean_rawdata / ASR / порога ICLabel
    ica_final: true    # step11: clean_rawdata + ASR + ICA + ICLabel на всём сегменте
  force: []            # шаги, которые пересчитать принудительно: [bcg, ica_opt, ica_final]
  # Если параметры шага в этом конфиге изменились с прошлого запуска — шаг
  # (и все последующие) пересчитываются автоматически.
  rerun_on_config_change: true
  continue_on_error: true   # ошибка в одном сегменте не останавливает весь батч

# -----------------------------------------------------------------------------
# Общие частотные полосы (используются в метриках всех шагов)
# -----------------------------------------------------------------------------
bands:
  alpha: [8.0, 13.0]

# -----------------------------------------------------------------------------
# step08: фильтр и обрезка краев перед BCG
# -----------------------------------------------------------------------------
filter:
  hp: 1.0     # Гц, high-pass (убирает дрейф/пот; важно для OBS и ICA)
  lp: 80.0    # Гц, low-pass
  notch: 50.0 # Гц, Notch-фильтр сетевой наводки (50 Гц, полоса 49-51 Гц)

# Обрезка краевых всплесков (устраняет краевые артефакты Bergen AAS и фильтрации)
# ВНИМАНИЕ про start_sec: паддинг Бергена (step05) уже делает левый край чистым
# (проверено на 1916/drone: 0-1с RMS=0.76x от середины и после band-pass+notch).
# start_sec=0.0 => старт совпадает с эталоном Димы до отсчёта (оба 500.00с),
# что чинит временное выравнивание в compare_dima/кросс-корреляции.
# Правый край паддингом НЕ покрыт (сканер выключен), там всплеск ~15x => end_sec нужен.
trim:
  enabled: true
  start_sec: 0.0   # Левый край уже чист после паддинга step05 (не сдвигаем старт)
  end_sec: 1.0     # Секунд с конца записи (отсекает конечный краевой всплеск)

# -----------------------------------------------------------------------------
# step08: BCG (EEGLAB fMRIB, Optimal Basis Set)
# -----------------------------------------------------------------------------
bcg:
  npc_grid: [2, 3, 4, 5, 6, 7]   # перебираемое число PCA-компонент OBS (Dima использовал 4..7)
  fixed_npc: null        # число -> не перебирать, использовать только его (быстрее)
  alpha_gate_min: 0.75   # npc допустим, только если сохраняет >= 75% альфы
  min_cardiac_suppr: 0.20 # минимально требуемое кардио-подавление (20%)
  alpha_warn_min: 0.60   # ниже — флаг REVIEW в отчёте
  cardiac_band: [0.7, 4.0]
  # Каналы для выбора npc (фронтальные — сильный BCG, затылочные — альфа)
  pilot_channels: [Fp1, Fp2, F3, F4, Fz, Cz, C3, C4, O1, Oz, O2, Pz, P3, P4]
  # Каналы для финальных метрик и графиков
  eval_channels: [Fp1, Fp2, F3, F4, Fz, Cz, C3, C4, O1, Oz, O2, Pz, P3, P4]
  # Остаточная чистка BCG после fMRIB OBS (Python): beat-wise AAS + OBS на остатке.
  # Убирает пульсовую волну BCG (~250 мс после R-пика), которую OBS недовычитает.
  residual_aas: true            # включить этап
  aas_neighbors: 11             # число соседних ударов для AAS-шаблона (K)
  residual_obs_npc_grid: [0, 2, 3, 4, 5]  # перебор компонент OBS на остатке (0 = только AAS)
  # Гейт выбора npc:
  #  efficiency (по умолч.) — npc берётся, если падение затылочной альфы "оплачено"
  #    соразмерным подавлением кардио: cardiac_suppr >= lambda*(1-alpha_ret).
  #    residual-OBS по построению вычитает только сигнал внутри QRS-эпох, поэтому
  #    снятая им альфа — кардиальная; абсолютный порог её ошибочно принимал за мозг
  #    и откатывал трудных субъектов (1927v/1928/1929) на npc=0 (BCG 1.6-2.3 мкВ).
  #  absolute — старый режим: npc только если сохраняет >= residual_alpha_gate альфы.
  residual_gate_mode: efficiency
  residual_alpha_eff_lambda: 1.0  # efficiency: порог "цены" альфы за подавление кардио
  residual_alpha_gate: 0.85     # absolute: npc берётся только если сохраняет >= 85% затылочной альфы

# -----------------------------------------------------------------------------
# step10: подбор параметров ICA-этапа
# -----------------------------------------------------------------------------
ica_opt:
  # Длительность (с) начала сегмента для оптимизации. ВНИМАНИЕ: для ICA на ~95
  # каналах 60 с (15000 отсчётов) — очень мало (нужно ~20*N^2). Рекомендуется
  # 300 (весь сегмент) или включить iclabel.ica_pca_max.
  duration_sec: 300.0
  max_channel_removal_fraction: 0.05   # жесткий лимит: выбрасывать не более 5% каналов (макс ~4-5)
  # Сетка clean_rawdata: "off" сохраняет все каналы без удаления (артефакты чистятся через ICA + ASR)
  flatline_grid: [5.0]
  channel_grid: ["off"]
  line_grid: ["off"]
  # Сетка ASR BurstCriterion: реконструкция всплесков на месте без вырезания каналов
  burst_grid: ["off", 30.0, 25.0, 20.0]
  hf_artifact_band: [40.0, 80.0]   # полоса "артефакта" для оценки пользы ASR
  asr_min_hf_gain: 0.05            # ASR выбирается, если подавляет 40-80 Гц хотя бы на 5%
  asr_min_alpha_ret: 0.90          # ... и сохраняет >= 90% альфы
  # Сетка порогов ICLabel
  threshold_grid: [0.70, 0.75, 0.80, 0.85]
  # Каналы, удаление которых сильно штрафуется
  protected_channels: [Fz, FCz, Cz, CPz, Pz, POz, Oz, AFz,
                       F1, F2, FC1, FC2, C1, C2, CP1, CP2, P1, P2]

# -----------------------------------------------------------------------------
# ICLabel / ICA (общие для step10 и step11)
# -----------------------------------------------------------------------------
iclabel:
  # Бэкенд ICLabel: "python" (mne-icalabel, быстро и стабильно) или "matlab"
  backend: python
  # IC класса 'Other' удаляется, только если P(Brain) < этого значения
  other_brain_max: 0.08
  # Максимум компонент ICA (95 = полный ранг, изолирует все гармоники шума)
  ica_pca_max: 95

# -----------------------------------------------------------------------------
# step11: финальная ICA на всём сегменте
# -----------------------------------------------------------------------------
ica_final:
  # true  -> брать параметры из step10 (optuna_ica_best_params.json),
  #          а defaults — только если файла нет
  # false -> всегда использовать defaults (step10 можно выключить)
  use_optimized_params: true
  defaults:
    ica_hp_hz: 1.0       # Гц, high-pass фильтр ТОЛЬКО для обучения ICA (убирает медленные дрейфы)
    flatline_crit: 5.0
    channel_crit: "off"  # По умолчанию каналы не удаляются (сохраняются все сенсоры)
    line_crit: "off"     # Линейный шум убирается фильтром/ICA, не удаляя каналы (Fz, C3)
    iclabel_thresh: 0.75
    burst_crit: 20.0     # ASR чистит всплески во времени без вырезания каналов
  # Режим отбраковки компонент:
  #   "thresholds" - универсальные пороги классов ICLabel (подобраны через Optuna)
  #   "meta_model" - обученный регулярный мета-классификатор (config/ica_meta_model.json)
  # rejection_mode: "thresholds"
  rejection_mode:  "thresholds"
  # Принудительно перекрыть отдельные параметры поверх step10:
  force_params:
    burst_crit: 20.0
    thresh_other: 0.60
    other_brain_max: 0.10
    thresh_muscle: 0.45
    thresh_line_chan: 0.85
    thresh_eye: 0.80
    thresh_heart: 0.65
    max_brain_prob: 0.12
    max_rej_fraction: 0.12
  # Защита от перечистки
  guards:
    min_iclabel_thresh: 0.65
    max_channel_crit: 0.70   # Защита: не допускать агрессивного удаления каналов (>0.70)
    min_burst_crit: 5.0
  # Детектор остаточного BCG по QRS-синхронности компонент: доля энергии IC,
  # объяснённая усреднением по ударам (шум ~0.002, настоящие BCG-IC 0.08-0.64).
  # Линейная корреляция с ЭКГ и метка ICLabel 'heart' такие компоненты пропускают.
  cardiac_qrs:
    ratio_thresh: 0.05   # 0 = выключить правило
    max_ics: 4           # не более N компонент по этому правилу
    max_brain: 0.80      # не удалять, если ICLabel уверен, что это brain

# -----------------------------------------------------------------------------
# Выход, отчёты, очистка
# -----------------------------------------------------------------------------
output:
  export_set: true                 # дополнительно сохранить <seg>_ica_clean.set (EEGLAB)
  report_dir: reports/cleanP02     # сводные CSV/лог (относительно корня проекта)

cleanup:
  delete_prebcg_fif: false         # удалить derivatives/02_resampled250 (промежуточный)
  delete_ica_opt_workdir: false    # удалить segments/<seg>/optuna_ica_trials (кеш ICA step10)

# Пороги для флага REVIEW в сводной таблице (ничего не удаляют, только помечают)
qc:
  min_bcg_cardiac_suppression: 0.25
  min_bcg_alpha_retention: 0.60
  min_final_alpha_retention: 0.70
  max_channels_removed_frac: 0.15
  max_ic_rejected_frac: 0.50
  max_variance_drop: 0.80

# -----------------------------------------------------------------------------
# Переопределения для отдельных сегментов / субъектов
# (порядок применения: segments -> subjects -> subject_segments)
# -----------------------------------------------------------------------------
overrides:
  segments:
    video:
      bcg:
        alpha_gate_min: 0.50
        # На video альфа подавлена (глаза открыты + зрительная стимуляция) и менее
        # ценна, поэтому допускаем более сильный residual-OBS: иначе у 1916/video
        # гейт 0.85 отбраковывал npc=2 (suppr 0.91, alpha_ret 0.69) и откатывался
        # на npc=0 (suppr лишь 0.32). 0.65 возвращает сильное кардио-подавление.
        residual_alpha_gate: 0.65
      ica_final:
        defaults:
          burst_crit: 30.0
      qc:
        min_bcg_alpha_retention: 0.50
    drone:
      bcg:
        alpha_gate_min: 0.55
      ica_final:
        defaults:
          burst_crit: 25.0
      qc:
        min_bcg_alpha_retention: 0.50
    lasertag:
      bcg:
        alpha_gate_min: 0.55
      ica_final:
        defaults:
          burst_crit: 25.0
      qc:
        min_bcg_alpha_retention: 0.50
    eo:
      bcg:
        alpha_gate_min: 0.60
      qc:
        min_bcg_alpha_retention: 0.55
    ec:
      bcg:
        alpha_gate_min: 0.75
      ica_final:
        defaults:
          burst_crit: "off"
      qc:
        min_bcg_alpha_retention: 0.60
  subjects:
    "1928":
      bcg:
        npc_grid: [2, 3]
  subject_segments: {}
